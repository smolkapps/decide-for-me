name: iOS TestFlight Distribution

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build_and_upload:
    # Automatic TestFlight requires reviewed readiness and Studio; hosted rollback stays manual.
    if: >-
      github.event_name != 'push' ||
      (vars.STUDIO_CI_AUTO_TESTFLIGHT == 'true' &&
      (vars.STUDIO_CI_MACOS_26 == '' ||
      vars.STUDIO_CI_MACOS_26 == '["self-hosted","macOS","ARM64","studio-macos","studio-run-{0}"]'))
    # Studio by default; STUDIO_CI_MACOS_26 restores the original hosted runner.
    runs-on: ${{ fromJSON(format(vars.STUDIO_CI_MACOS_26 || '["self-hosted","macOS","ARM64","studio-macos","studio-run-{0}"]', github.run_id)) }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          if [[ "$RUNNER_NAME" == studio-* ]]; then
            export DEVELOPER_DIR=/Applications/Xcode-26.2.0.app/Contents/Developer
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
            xcodebuild -version
            exit 0
          fi
          sudo xcode-select -s /Applications/Xcode_26.2.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Configure Manual Signing
        run: |
          python3 - <<'PYEOF'
          path = "ios/Runner.xcodeproj/project.pbxproj"
          with open(path) as f: content = f.read()
          DIST = "Apple" + " " + "Distribution"
          TEAM = "4R42A425CK"
          PROFILE = "DecideForMe AppStore"
          BUNDLE = "org.smolkin.DecideForMe"
          for old_id in ["Apple Development", "iOS Development", "iOS Distribution", "iPhone Distribution", "iPhone Developer"]:
              content = content.replace(f'CODE_SIGN_IDENTITY = "{old_id}"', f'CODE_SIGN_IDENTITY = "{DIST}"')
              content = content.replace(f'"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "{old_id}"', f'"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "{DIST}"')
          content = content.replace('CODE_SIGN_STYLE = Automatic', 'CODE_SIGN_STYLE = Manual')
          import re
          content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = ".*?";', f'PROVISIONING_PROFILE_SPECIFIER = "{PROFILE}";', content)
          content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "";', f'PROVISIONING_PROFILE_SPECIFIER = "{PROFILE}";', content)
          with open(path, "w") as f: f.write(content)
          PYEOF

      - name: Build IPA
        run: flutter build ipa --release --build-number=${{ github.run_number }} --export-options-plist=ios/Runner/ExportOptions.plist

      - name: Validate IPA with App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --validate-app --type ios --file build/ios/ipa/*.ipa --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
